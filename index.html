<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎵 Soundboard</h1>
    <button id="stop-all">⏹ Parar todos</button>
  </header>

  <main>
    <div class="grid" id="sound-grid">
    <button class="sound-btn">Rizz</button>
    <button class="sound-btn">Summer</button>
    <button class="sound-btn">Pedro</button>
    <button class="sound-btn">Chega</button>
    <button class="sound-btn">Indian</button>
    <button class="sound-btn">Jonh Cena</button>
    <button class="sound-btn">Preto Cigano</button>
    <button class="sound-btn">67</button>
    <button class="sound-btn">Po Pi Po</button>
    <button class="sound-btn">Fortnite</button>
    <button class="sound-btn">He He He Ha</button>
    <button class="sound-btn">LEVANTATE</button>
    <button class="sound-btn">Siuuuuu</button>
    <button class="sound-btn">Mi Bombo</button>
    <button class="sound-btn">FAAAH</button>
    <button class="sound-btn">Youre Phone</button>
    <button class="sound-btn">Oi, Oi Oe Oi A </button>
    <button class="sound-btn">°__°</button>
    <button class="sound-btn">Mario</button>
    <button class="sound-btn">Fein Nokia</button>
    <button class="sound-btn">Tung Tung Sahur</button>
    <button class="sound-btn">Meow</button>
    <button class="sound-btn">TU TU TU DU</button>
    <button class="sound-btn">Ultima Dança</button>

   
</div>

    <div class="upload-zone">
  <h2>Adicionar som</h2>

  <input type="file" id="upload-input" accept=".mp3,.wav,.ogg,audio/*">

  <label for="upload-input" class="upload-btn">
    <span class="upload-icon">📂</span>
    <span class="upload-texto">Escolher ficheiro</span>
  </label>

  <div class="upload-preview" id="upload-preview">
    <span class="preview-icon">🎵</span>
    <span class="preview-nome" id="preview-nome">Nenhum ficheiro selecionado</span>
  </div>

  <p class="upload-formatos">Formatos aceites: .mp3 · .wav · .ogg</p>
</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
