<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎵 Soundboard</h1>
    <button id="stop-all">⏹ Parar todos</button>
  </header>

  <main>
    <div class="grid" id="sound-grid">
    <button class="sound-btn">Rizz</button>
    <button class="sound-btn">Summer</button>
    <button class="sound-btn">Pedro</button>
    <button class="sound-btn">Chega</button>
    <button class="sound-btn">Indian</button>
    <button class="sound-btn">Jonh Cena</button>
    <button class="sound-btn">Preto Cigano</button>
    <button class="sound-btn">67</button>
    <button class="sound-btn">Som 9</button>
    <button class="sound-btn">Som 10</button>
    <button class="sound-btn">Som 11</button>
    <button class="sound-btn">Som 12</button>
    <button class="sound-btn">Som 13</button>
    <button class="sound-btn">Som 14</button>
    <button class="sound-btn">Som 15</button>
    <button class="sound-btn">Som 16</button>
    <button class="sound-btn">Som 17</button>
    <button class="sound-btn">Som 18</button>
    <button class="sound-btn">Som 19</button>
    <button class="sound-btn">Som 20</button>
    <button class="sound-btn">Som 21</button>
    <button class="sound-btn">Som 22</button>
    <button class="sound-btn">Som 23</button>
    <button class="sound-btn">Som 24</button>
</div>

    <div class="upload-zone">
  <h2>Adicionar som</h2>

  <input type="file" id="upload-input" accept=".mp3,.wav,.ogg,audio/*">

  <label for="upload-input" class="upload-btn">
    <span class="upload-icon">📂</span>
    <span class="upload-texto">Escolher ficheiro</span>
  </label>

  <div class="upload-preview" id="upload-preview">
    <span class="preview-icon">🎵</span>
    <span class="preview-nome" id="preview-nome">Nenhum ficheiro selecionado</span>
  </div>

  <p class="upload-formatos">Formatos aceites: .mp3 · .wav · .ogg</p>
</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
