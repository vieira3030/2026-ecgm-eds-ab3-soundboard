<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎵 Soundboard</h1>
    <button id="stop-all">⏹ Parar todos</button>
  </header>

  <main>
    <div class="grid" id="sound-grid">
     <button class="sound-btn">Som 1</button>
<button class="sound-btn">Som 2</button>
<button class="sound-btn">Som 3</button>
<button class="sound-btn">Som 4</button>
<button class="sound-btn">Som 5</button>
<button class="sound-btn">Som 6</button>
<button class="sound-btn">Som 7</button>
<button class="sound-btn">Som 8</button>
    </div>

    <div class="upload-zone">
      <h2>Adicionar som</h2>
      <input type="file" id="upload-input" accept=".mp3,.wav,.ogg">
      <label for="upload-input">📂 Escolher ficheiro</label>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
